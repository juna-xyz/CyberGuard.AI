<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%" fill="none">
  <defs>
    <filter id="cardShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#152238" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Connecting Backbone Flowline -->
  <line x1="130" y1="90" x2="550" y2="90" stroke="#DCE4ED" stroke-width="2" stroke-dasharray="6 6" />

  <!-- STEP 1: TELAAH TEKS (IDENTIFIKASI) -->
  <g transform="translate(40, 25)">
    <rect x="0" y="0" width="170" height="130" rx="14" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Step Badge -->
    <rect x="14" y="14" width="28" height="20" rx="4" fill="#EEF3F8" />
    <text x="28" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">01</text>
    <!-- Icon Circle -->
    <circle cx="134" cy="24" r="14" fill="#DBEAFE" />
    <!-- Search / Eye Icon -->
    <circle cx="132" cy="22" r="5" stroke="#2563EB" stroke-width="1.5" fill="none" />
    <line x1="136" y1="26" x2="140" y2="30" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" />
    <!-- Titles -->
    <text x="14" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#152238">Telaah Teks</text>
    <text x="14" y="86" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5D6B80">Periksa bahasa desakan,</text>
    <text x="14" y="102" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5D6B80">pengirim, &amp; kejanggalan.</text>
  </g>

  <!-- STEP 2: UJI BUKTI (VERIFIKASI) -->
  <g transform="translate(255, 25)">
    <rect x="0" y="0" width="170" height="130" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Step Badge -->
    <rect x="14" y="14" width="28" height="20" rx="4" fill="#DBEAFE" />
    <text x="28" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">02</text>
    <!-- Icon Circle -->
    <circle cx="134" cy="24" r="14" fill="#DBEAFE" />
    <!-- Balance / Check Scale Icon -->
    <path d="M128 28 L140 28 M134 18 V28 M128 22 L134 19 L140 22" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Titles -->
    <text x="14" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563EB">Uji Bukti</text>
    <text x="14" y="86" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5D6B80">Cocokkan domain &amp; tolak</text>
    <text x="14" y="102" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5D6B80">permintaan data rahasia.</text>
  </g>

  <!-- STEP 3: AMBIL SIKAP AMAN (MITIGASI) -->
  <g transform="translate(470, 25)">
    <rect x="0" y="0" width="170" height="130" rx="14" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Step Badge -->
    <rect x="14" y="14" width="28" height="20" rx="4" fill="#EEF3F8" />
    <text x="28" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">03</text>
    <!-- Icon Circle -->
    <circle cx="134" cy="24" r="14" fill="#DBEAFE" />
    <!-- Shield Check Icon -->
    <path d="M134 16 L141 19 V24 C141 28 138 31 134 32 C130 31 127 28 127 24 V19 Z" fill="none" stroke="#2563EB" stroke-width="1.5" />
    <path d="M131 24 L133 26 L137 22" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Titles -->
    <text x="14" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#152238">Sikap Aman</text>
    <text x="14" y="86" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5D6B80">Hubungi kontak resmi &amp;</text>
    <text x="14" y="102" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5D6B80">laporkan ke aduankonten.</text>
  </g>
</svg>
