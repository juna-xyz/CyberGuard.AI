<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="100%" fill="none">
  <defs>
    <!-- Zone Soft Gradients -->
    <linearGradient id="lowZone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6F6EC" />
      <stop offset="100%" stop-color="#24734A" />
    </linearGradient>
    <linearGradient id="medZone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF3D8" />
      <stop offset="100%" stop-color="#9A5B08" />
    </linearGradient>
    <linearGradient id="highZone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDECEC" />
      <stop offset="100%" stop-color="#B93838" />
    </linearGradient>
  </defs>

  <!-- Base Gauge Background Arc (Radius 120, Center at 180, 180) -->
  <path d="M 40 180 A 140 140 0 0 1 320 180" fill="none" stroke="#EEF3F8" stroke-width="20" stroke-linecap="round" />

  <!-- Segment 1: Low Risk Arc (180 deg to 120 deg) -->
  <path d="M 44 180 A 136 136 0 0 1 112 62" fill="none" stroke="#24734A" stroke-width="14" stroke-linecap="round" stroke-dasharray="140" stroke-dashoffset="0" />
  
  <!-- Segment 2: Medium Risk Arc (120 deg to 60 deg) -->
  <path d="M 124 55 A 136 136 0 0 1 236 55" fill="none" stroke="#9A5B08" stroke-width="14" stroke-linecap="round" stroke-dasharray="140" stroke-dashoffset="0" />

  <!-- Segment 3: High Risk Arc (60 deg to 0 deg) -->
  <path d="M 248 62 A 136 136 0 0 1 316 180" fill="none" stroke="#B93838" stroke-width="14" stroke-linecap="round" stroke-dasharray="140" stroke-dashoffset="0" />

  <!-- Inner Scale Markings -->
  <path d="M 75 180 A 105 105 0 0 1 285 180" fill="none" stroke="#DCE4ED" stroke-width="1.5" stroke-dasharray="4 6" />

  <!-- Qualitative Label Anchors -->
  <text x="50" y="202" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#24734A" text-anchor="middle">RENDAH</text>
  <text x="180" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#9A5B08" text-anchor="middle">SEDANG</text>
  <text x="310" y="202" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#B93838" text-anchor="middle">TINGGI</text>

  <!-- Central Dynamic Pivot & Hub -->
  <circle cx="180" cy="180" r="28" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2" />
  <circle cx="180" cy="180" r="14" fill="#152238" />
  <circle cx="180" cy="180" r="5" fill="#2563EB" />

  <!-- Indicative Radar Scan Sweep Lines -->
  <line x1="180" y1="180" x2="180" y2="76" stroke="#152238" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <circle cx="180" cy="74" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
